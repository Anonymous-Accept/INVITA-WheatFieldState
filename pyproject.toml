[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invita-wheatfieldstate-reviewer"
version = "0.1.0"
description = "Anonymous reviewer code package for INVITA-WheatFieldState benchmark experiments"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Anonymous Authors"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = [
    "agriculture",
    "benchmark",
    "remote-sensing",
    "ndvi",
    "lai",
    "wheat",
]

dependencies = [
    "tqdm>=4.64.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "streamlit>=1.37.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "psycopg2-binary>=2.9.0",
    "python-magic>=0.4.27",
    "zstandard>=0.22.0",
    "requests>=2.28.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
llm = [
    "vllm>=0.5.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "accelerate>=0.20.0",
    "huggingface_hub>=0.20.0",
    "flashinfer-python>=0.3.1",
    "nvidia-ml-py>=12.0.0",
]
geo = [
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "xarray>=2023.0.0",
    "netCDF4>=1.6.0",
    "h5py>=3.9.0",
    "fiona>=1.9.0",
    "laspy>=2.5.0",
]
docs = [
    "PyMuPDF>=1.23.0",
    "python-pptx>=0.6.21",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML",
    "types-requests",
]
all = [
    "vllm>=0.5.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "accelerate>=0.20.0",
    "huggingface_hub>=0.20.0",
    "flashinfer-python>=0.3.1",
    "nvidia-ml-py>=12.0.0",
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "xarray>=2023.0.0",
    "netCDF4>=1.6.0",
    "h5py>=3.9.0",
    "fiona>=1.9.0",
    "laspy>=2.5.0",
    "PyMuPDF>=1.23.0",
    "python-pptx>=0.6.21",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML",
    "types-requests",
]

[project.urls]
Homepage = "https://anonymous.example/invita-wheatfieldstate"
Documentation = "https://anonymous.example/invita-wheatfieldstate/docs"
Repository = "https://anonymous.example/invita-wheatfieldstate/code"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "experiments*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | legacy
  | models
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "legacy",
    "models",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # function call in default argument
    "C901",   # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "legacy/",
    "models/",
    "tests/",
]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "requires_db: marks tests that require database connection",
    "requires_llm: marks tests that require LLM server",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/legacy/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
